[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vitaloptima"
version = "2.0.0"
description = "AI-Assisted Hospital Operations Intelligence & Mathematical Resource Optimization"
authors = [{ name = "VitalOptima Engineering Team" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.35.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "plotly>=5.18.0",
    "scikit-learn>=1.3.0",
    "ortools>=9.8.0",
    "scipy>=1.11.0",
    "pillow>=10.0.0",
    "psycopg2-binary>=2.9.9",
    "sqlalchemy>=2.0.0",
    "python-dotenv>=1.0.0",
    "openai>=1.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "bandit>=1.7.5",
    "mypy>=1.9.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    ".git",
    "__pycache__",
    "venv",
    ".venv",
    "data",
    "evaluation/forecasting",
]

[tool.ruff.lint]
select = ["E", "F", "W", "C90", "B"]
ignore = ["E501", "B008", "C901", "B904"]

[tool.bandit]
exclude_dirs = ["tests", "venv", ".venv", "evaluation"]
skips = ["B101", "B608"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_configs = true
disallow_untyped_defs = false
