name: VitalOptima Enterprise CI / CD Pipeline

on:
  push:
    branches: [ main, master, engineering-upgrade ]
  pull_request:
    branches: [ main, master, engineering-upgrade ]

jobs:
  quality_and_test_suite:
    name: Lint, Audit & Test Matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install Runtime and Development Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Static Code Analysis (Ruff)
      run: |
        ruff check .

    - name: Security Vulnerability Scan (Bandit AST)
      run: |
        bandit -r models services db src -c pyproject.toml

    - name: Initialize Testing Database Schema
      env:
        APP_ENV: testing
        SEED_DEMO_USERS: "false"
      run: |
        python -c "from db.database import init_db; init_db()"

    - name: Execution Smoke Test (Core System Readiness)
      env:
        APP_ENV: testing
        XAI_API_KEY: ""
      run: |
        python -m unittest tests/test_smoke.py

    - name: Mathematical MILP Optimization Verification
      env:
        APP_ENV: testing
      run: |
        python -m unittest tests/test_optimizer_rigor.py

    - name: Time-Series Machine Learning & Leakage Verification
      env:
        APP_ENV: testing
      run: |
        python -m unittest tests/test_forecast_integrity.py

    - name: Concurrency & Database Partial Index Reliability
      env:
        APP_ENV: testing
      run: |
        python -m unittest tests/test_database_reliability.py tests/test_admission_concurrency.py

    - name: Cybersecurity, Session Expiry & AI Governance Check
      env:
        APP_ENV: testing
      run: |
        python -m unittest tests/test_cybersecurity_and_governance.py

    - name: Comprehensive Regression Test Discovery
      env:
        APP_ENV: testing
        XAI_API_KEY: ""
      run: |
        python -m unittest discover tests
